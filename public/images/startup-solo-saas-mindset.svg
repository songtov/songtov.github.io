<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Many small bets: most products stay small, a few carry the portfolio</title>
  <rect width="720" height="340" rx="16" fill="#f8fafc"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">Many small bets, a few winners</text>
  <text x="32" y="70" font-size="15" fill="#475569">Each bar is one product. Height = revenue it ends up making.</text>
  <line x1="32" y1="270" x2="688" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#cbd5e1">
    <rect x="44" y="258" width="28" height="12" rx="3"/>
    <rect x="84" y="262" width="28" height="8" rx="3"/>
    <rect x="124" y="250" width="28" height="20" rx="3"/>
    <rect x="164" y="264" width="28" height="6" rx="3"/>
    <rect x="244" y="260" width="28" height="10" rx="3"/>
    <rect x="284" y="254" width="28" height="16" rx="3"/>
    <rect x="324" y="264" width="28" height="6" rx="3"/>
    <rect x="404" y="262" width="28" height="8" rx="3"/>
    <rect x="444" y="246" width="28" height="24" rx="3"/>
    <rect x="484" y="264" width="28" height="6" rx="3"/>
    <rect x="564" y="258" width="28" height="12" rx="3"/>
    <rect x="644" y="262" width="28" height="8" rx="3"/>
  </g>
  <g fill="#6366f1">
    <rect x="204" y="150" width="28" height="120" rx="3"/>
    <rect x="364" y="190" width="28" height="80" rx="3"/>
    <rect x="524" y="110" width="28" height="160" rx="3"/>
    <rect x="604" y="160" width="28" height="110" rx="3"/>
  </g>
  <text x="32" y="300" font-size="15" fill="#475569">time →</text>
  <g font-size="15">
    <rect x="420" y="290" width="16" height="16" rx="3" fill="#cbd5e1"/>
    <text x="442" y="303" fill="#334155">small or failed</text>
    <rect x="560" y="290" width="16" height="16" rx="3" fill="#6366f1"/>
    <text x="582" y="303" fill="#334155">winner</text>
  </g>
</svg>
