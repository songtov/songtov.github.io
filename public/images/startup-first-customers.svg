<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The relaunch loop: launch, measure, change the pitch, launch again, until first customers</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="400" rx="16" fill="#f8fafc"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">One launch is one try. Keep looping.</text>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M232 130 L380 130"/>
    <path d="M470 160 L470 230"/>
    <path d="M380 262 L232 262"/>
    <path d="M140 230 L140 162"/>
    <path d="M560 130 L592 130"/>
  </g>
  <g font-size="16" font-weight="600" text-anchor="middle">
    <rect x="48" y="100" width="184" height="60" rx="10" fill="#6366f1"/>
    <text x="140" y="136" fill="#ffffff">Launch</text>
    <rect x="380" y="100" width="180" height="60" rx="10" fill="#e0e7ff"/>
    <text x="470" y="128" fill="#312e81">Measure</text>
    <text x="470" y="148" font-size="14" font-weight="400" fill="#312e81">visits, signups, payments</text>
    <rect x="380" y="232" width="180" height="60" rx="10" fill="#e0e7ff"/>
    <text x="470" y="268" fill="#312e81">Change the pitch</text>
    <rect x="48" y="232" width="184" height="60" rx="10" fill="#e0e7ff"/>
    <text x="140" y="268" fill="#312e81">Launch again</text>
    <rect x="596" y="100" width="100" height="60" rx="10" fill="#16a34a"/>
    <text x="646" y="126" fill="#ffffff">First</text>
    <text x="646" y="146" fill="#ffffff">customers</text>
  </g>
  <g font-size="14" fill="#475569" text-anchor="middle">
    <text x="470" y="320">rebrand · reposition · repurpose</text>
    <text x="360" y="366">Headline first: most visitors never scroll past it.</text>
  </g>
</svg>
