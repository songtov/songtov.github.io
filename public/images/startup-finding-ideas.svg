<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Three overlapping circles: your own problem, people already pay, you can reach the buyers</title>
  <rect width="720" height="420" rx="16" fill="#f8fafc"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">Where weekend-sized ideas live</text>
  <g fill-opacity="0.45" stroke-width="2">
    <circle cx="290" cy="185" r="115" fill="#93c5fd" stroke="#3b82f6"/>
    <circle cx="430" cy="185" r="115" fill="#c4b5fd" stroke="#8b5cf6"/>
    <circle cx="360" cy="295" r="115" fill="#f9a8d4" stroke="#ec4899"/>
  </g>
  <g font-size="16" font-weight="600" text-anchor="middle">
    <text x="230" y="150" fill="#1e3a8a">Your own</text>
    <text x="230" y="170" fill="#1e3a8a">problem</text>
    <text x="490" y="150" fill="#4c1d95">People already</text>
    <text x="490" y="170" fill="#4c1d95">pay for it</text>
    <text x="360" y="365" fill="#831843">You can reach</text>
    <text x="360" y="385" fill="#831843">the buyers</text>
  </g>
  <rect x="300" y="210" width="120" height="44" rx="8" fill="#0f172a"/>
  <text x="360" y="230" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Weekend-sized</text>
  <text x="360" y="247" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">idea</text>
</svg>
